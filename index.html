<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eva 💖</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(180deg, #ffb6c1, #ff69b4);
    color: #fff;
    text-align: center;
}

.container {
    padding: 30px 18px;
    max-width: 480px;
    margin: auto;
}

.heart {
    font-size: 3.5em;
    animation: pulse 1.5s infinite;
}

h1 {
    font-size: 2.2em;
    margin: 15px 0;
}

.card {
    background: rgba(255,255,255,0.25);
    border-radius: 20px;
    padding: 22px;
    margin-top: 20px;
}

button {
    margin-top: 20px;
    font-size: 1.1em;
    padding: 14px 30px;
    border: none;
    border-radius: 30px;
    background: #ff1493;
    color: #fff;
    cursor: pointer;
}

@keyframes pulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.15); }
    100% { transform: scale(1); }
}
</style>
</head>

<body>

<div class="container">
    <div class="heart">💗</div>
    <h1>Eva, eu te amo</h1>

    <div class="card" id="box">
        <p>1️⃣ Você sabe que é a pessoa mais importante da minha vida?</p>
        <button onclick="next()">Sim 💕</button>
    </div>
</div>

<script>
let step = 1;

function next() {
    const box = document.getElementById("box");

    if (step === 1) {
        box.innerHTML =
            "<p>2️⃣ Você sente o quanto eu te amo todos os dias?</p>" +
            "<button onclick='next()'>Sim 💖</button>";
    }
    else if (step === 2) {
        box.innerHTML =
            "<p>3️⃣ Você aceita continuar sorrindo comigo?</p>" +
            "<button onclick='next()'>Sim 💕</button>";
    }
    else if (step === 3) {
        box.innerHTML =
            "<p>4️⃣ Você promete caminhar comigo em todos os momentos?</p>" +
            "<button onclick='next()'>Sim 💗</button>";
    }
    else if (step === 4) {
        box.innerHTML =
            "<p>5️⃣ Você quer ser meu amor hoje, amanhã e sempre?</p>" +
            "<button onclick='next()'>Sim 💘</button>";
    }
    else {
        box.innerHTML =
            "<h2>Então é pra sempre 💖</h2>" +
            "<p>Eu te amo mais do que tudo, Eva.</p>" +
            "<p>💗💗💗</p>";
    }

    step++;
}
</script>

</body>
</html>
